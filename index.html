<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JogiIoT - AI Assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#212121">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{--bg:#212121;--sidebar:#171717;--card:#2f2f2f;--border:#383838;--text:#ececec;--muted:#b4b4b4;--accent:#ffffff;--user-bg:#2f2f2f;--ai-bg:#212121;--hover:#262626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Söhne,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}

.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px}
.new-chat{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:.875rem;font-weight:500;cursor:pointer;width:100%;text-align:left;transition:background .15s}
.new-chat:hover{background:var(--hover)}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.history-item{padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.history-item:hover,.history-item.active{background:var(--hover);color:var(--text)}
.settings{border-top:1px solid var(--border);padding-top:10px}
.reset-btn{width:100%;background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem;text-align:left}
.reset-btn:hover{background:var(--hover);color:#ff5555}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;font-size:.95rem;font-weight:600;color:var(--muted);border-bottom:1px solid transparent}
.status{font-size:.75rem;display:flex;align-items:center;gap:6px}
.status .dot{width:6px;height:6px;background:#10a37f;border-radius:50%}

.chat-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;scroll-behavior:smooth}
.message-row{width:100%;display:flex;justify-content:center;padding:24px 16px}
.message-row.user{background:var(--user-bg)}
.message-row.assistant{background:var(--ai-bg)}
.message-inner{max-width:768px;width:100%;display:flex;gap:16px;line-height:1.7;font-size:1rem}

.avatar{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;flex-shrink:0}
.avatar.user{background:#5436da;color:#fff}
.avatar.ai{background:#10a37f;color:#fff}

.content{flex:1;overflow-x:auto;word-break:break-word}
.content pre{background:#000000;border-radius:6px;padding:12px;margin:12px 0;overflow-x:auto}
.content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.875rem}
.content p{margin-bottom:12px}.content p:last-child{margin-bottom:0}
.content img{max-width:100%;border-radius:8px;margin:8px 0}

.input-area{padding:16px 24px 24px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,transparent,var(--bg) 40%)}
.input-box{max-width:768px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:flex-end;gap:8px;position:relative;box-shadow:0 0 15px rgba(0,0,0,0.2)}
#input{flex:1;background:transparent;border:none;color:var(--text);font-size:1rem;line-height:1.5;resize:none;max-height:200px;outline:none;font-family:inherit}
.send-btn{background:var(--text);color:var(--bg);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.attach-btn{background:transparent;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.attach-btn:hover{color:var(--text);background:var(--hover)}

.attach-row{max-width:768px;width:100%;margin-bottom:8px;display:flex;gap:8px}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px 10px;font-size:.75rem;color:var(--muted)}
.attach-chip img{width:20px;height:20px;border-radius:3px;object-fit:cover}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text);padding:40px}
.empty h2{font-size:1.8rem;font-weight:600;margin-bottom:24px}
.hints{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:600px}
.hint{background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:.875rem}
.hint:hover{background:var(--hover);color:var(--text)}

.typing{display:flex;gap:4px;align-items:center;height:24px}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(1){animation-delay:-.32s}.typing span:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

.msg-actions{margin-top:6px;display:flex;gap:8px}
.copy-btn{background:transparent;border:none;color:var(--muted);font-size:.75rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.copy-btn:hover{background:var(--hover);color:var(--text)}

@media(max-width:768px){.sidebar{display:none}}
</style>
</head>
<body>

<div class="sidebar">
  <button class="new-chat" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div class="history" id="history"></div>
  <div class="settings">
    <button class="reset-btn" onclick="clearAll()">Clear conversations</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <span>JogiIoT</span>
    <div class="status"><div class="dot"></div><span id="statusText">Ready</span></div>
  </div>

  <div class="chat-container" id="chat">
    <div class="empty" id="empty">
      <h2>What can I help with?</h2>
      <div class="hints">
        <div class="hint" onclick="setHint('Write an Arduino script for a DHT11 sensor')">Arduino DHT11 code</div>
        <div class="hint" onclick="setHint('Explain how modern internal combustion engines work')">Explain engines</div>
        <div class="hint" onclick="setHint('Debug a JavaScript TypeError')">Debug JavaScript</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="attach-row" id="attachRow"></div>
    <div class="input-box">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach image">+</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
      <textarea id="input" rows="1" placeholder="Ask JogiIoT anything..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let messages = [], isLoading = false, pendingImg = null;

function clearAll(){
  if(!confirm('Clear all chats?')) return;
  localStorage.removeItem('jogiChats');
  location.reload();
}

let conversations = [];
try{ conversations = JSON.parse(localStorage.getItem('jogiChats') || '[]'); }catch(e){}
let activeId = null;

function saveChats(){ localStorage.setItem('jogiChats', JSON.stringify(conversations.slice(-30))); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderHistory(){
  const el = $('history');
  if(!conversations.length){ el.innerHTML = '<div style="color:var(--muted);font-size:.8rem;padding:8px">No recent chats</div>'; return; }
  el.innerHTML = conversations.slice().reverse().map(c=>`<div class="history-item ${c.id===activeId?'active':''}" onclick="loadChat(${c.id})">${esc(c.title)}</div>`).join('');
}

function track(title){
  if(!activeId){
    activeId = Date.now();
    conversations.push({id:activeId, title:(title||'New chat').slice(0,35), messages:[]});
    if(conversations.length>30) conversations = conversations.slice(-30);
  }
  const conv = conversations.find(c=>c.id===activeId);
  if(conv) conv.messages = messages.slice(-40);
  saveChats();
  renderHistory();
}

function loadChat(id){
  const conv = conversations.find(c=>c.id===id);
  if(!conv) return;
  activeId = id;
  messages = conv.messages.slice();
  $('chat').innerHTML = '';
  messages.forEach(m => {
    let displayContent = typeof m.content === 'string' ? m.content : m.content.find(p=>p.type==='text')?.text || '[Image]';
    let imgHtml = Array.isArray(m.content) ? m.content.filter(p=>p.type==='image_url').map(p=>`<img src="${p.image_url.url}">`).join('') : '';
    addMsg(m.role, displayContent + (imgHtml ? '<br>'+imgHtml : ''));
  });
  renderHistory();
}

function handleFile(input){
  const file = input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingImg = e.target.result;
    $('attachRow').innerHTML = `<div class="attach-chip"><img src="${pendingImg}"><span>${file.name}</span><button onclick="pendingImg=null;renderAttach()" style="background:none;border:none;color:var(--muted);cursor:pointer">×</button></div>`;
  };
  reader.readAsDataURL(file);
}
function renderAttach(){ $('attachRow').innerHTML = ''; }

function setHint(t){ $('input').value = t; $('input').focus(); }
function newChat(){ messages=[]; activeId=null; pendingImg=null; renderAttach(); renderHistory(); $('chat').innerHTML = '<div class="empty" id="empty"><h2>What can I help with?</h2><div class="hints"><div class="hint" onclick="setHint(\'Write an Arduino script for a DHT11 sensor\')">Arduino DHT11 code</div><div class="hint" onclick="setHint(\'Explain how modern internal combustion engines work\')">Explain engines</div><div class="hint" onclick="setHint(\'Debug a JavaScript TypeError\')">Debug JavaScript</div></div></div>'; }
function handleKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }

function addMsg(role, content){
  const empty = $('empty'); if(empty) empty.remove();
  const chat = $('chat');
  const row = document.createElement('div');
  row.className = 'message-row '+role;
  let html = role==='assistant' ? marked.parse(content) : esc(content).replace(/\n/g, '<br>');
  row.innerHTML = `<div class="message-inner"><div class="avatar ${role==='user'?'user':'ai'}">${role==='user'?'You':'JI'}</div><div class="content">${html}</div></div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  row.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  if(role==='assistant') addActions(row.querySelector('.content'), content);
}

function addActions(container, raw){
  if(container.querySelector('.msg-actions')) return;
  const bar = document.createElement('div'); bar.className = 'msg-actions';
  const copy = document.createElement('button'); copy.className = 'copy-btn'; copy.textContent = 'Copy';
  copy.onclick = ()=>{ navigator.clipboard.writeText(raw); copy.textContent='Copied'; setTimeout(()=>copy.textContent='Copy',1500); };
  bar.appendChild(copy);
  container.appendChild(bar);
}

function showTyping(){
  const chat = $('chat');
  const row = document.createElement('div'); row.className = 'message-row assistant'; row.id = 'typing';
  row.innerHTML = '<div class="message-inner"><div class="avatar ai">JI</div><div class="content"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){ const t = $('typing'); if(t) t.remove(); }

async function send(){
  const input = $('input');
  const text = input.value.trim();
  if(!text && !pendingImg) return;
  
  isLoading = true;
  $('sendBtn').disabled = true;
  input.value = '';

  let apiContent = text;
  let displayHtml = esc(text);

  if(pendingImg){
    apiContent = [
      { type: "text", text: text || "Describe this image:" },
      { type: "image_url", image_url: { url: pendingImg } }
    ];
    displayHtml += `<br><img src="${pendingImg}" style="max-height:200px">`;
    pendingImg = null;
    renderAttach();
  }

  addMsg('user', displayHtml);
  messages.push({ role: 'user', content: apiContent });
  track(text || 'Image inquiry');

  showTyping();
  $('statusText').textContent = 'Thinking...';

  try {
    const response = await fetch('https://jogi-iot-search-engine.onrender.com/api/nvidia/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: "system", content: "You are JogiIoT, an expert AI assistant and coding/IoT companion built for Jogi. Provide fast, accurate, and detailed answers, code examples, and image analyses." },
          ...messages
        ]
      })
    });

    const data = await response.json();
    removeTyping();

    if(!response.ok) {
      throw new Error(data.error || 'Server error occurred');
    }

    const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : JSON.stringify(data);
    
    addMsg('assistant', reply);
    messages.push({ role: 'assistant', content: reply });
    track();
    $('statusText').textContent = 'Ready';
  } catch(err) {
    removeTyping();
    addMsg('assistant', '**Error:** ' + err.message);
    $('statusText').textContent = 'Error';
  }

  isLoading = false;
  $('sendBtn').disabled = false;
  input.focus();
}

renderHistory();
</script>
</body>
</html>
