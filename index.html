<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogi IoT Search Engine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{--bg:#0f1117;--sidebar:#161b22;--card:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--user:#1f6feb22;--ai:#21262d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:290px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px}
.logo{font-size:1.25rem;font-weight:700;margin-bottom:4px}.logo span{color:var(--accent)}
.tagline{font-size:.72rem;color:var(--muted);margin-bottom:16px}
.new-chat{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:14px}
.history{flex:1;overflow-y:auto;font-size:.9rem}
.history-item{padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item:hover,.history-item.active{background:var(--card);color:var(--text)}
.settings{border-top:1px solid var(--border);padding-top:14px;font-size:.85rem;overflow-y:auto;max-height:55vh}
.settings label{display:block;margin-bottom:6px;color:var(--muted)}
.settings input,.settings select,.settings textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;margin-bottom:12px;font-size:.85rem}
.settings textarea{min-height:64px;max-height:130px;font-family:monospace;resize:vertical}
.reset-btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px;border-radius:6px;cursor:pointer;font-size:.78rem;margin-bottom:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:600}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .dot{width:8px;height:8px;background:var(--ok);border-radius:50%}
.chat-container{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.message{max-width:800px;margin:0 auto;width:100%;display:flex;gap:14px}
.avatar{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.avatar.user{background:#1f6feb}.avatar.ai{background:#238636}
.content{flex:1;background:var(--ai);padding:14px 18px;border-radius:12px;line-height:1.6;font-size:.95rem;min-width:0}
.message.user .content{background:var(--user)}
.content pre{background:#0d1117;border-radius:8px;padding:14px;overflow-x:auto;margin:12px 0;position:relative}
.content code{font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:.88rem}
.content p{margin-bottom:10px}.content p:last-child{margin-bottom:0}
.content img{max-width:100%;border-radius:8px;margin:8px 0}
.input-area{padding:16px 24px 24px;border-top:1px solid var(--border)}
.input-box{max-width:800px;margin:0 auto;position:relative}
#input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 50px 14px 50px;border-radius:12px;resize:none;font-size:1rem;line-height:1.5;min-height:56px;max-height:160px;outline:none;font-family:inherit}
#input:focus{border-color:var(--accent)}
.send-btn{position:absolute;right:10px;bottom:10px;background:var(--accent);border:none;width:36px;height:36px;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{background:var(--border);cursor:not-allowed}
.attach-btn{position:absolute;bottom:10px;left:8px;background:transparent;border:none;color:var(--muted);font-size:1.15rem;cursor:pointer;width:36px;height:36px;border-radius:8px}
.hints{max-width:800px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem}
.hint{background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:20px;cursor:pointer;color:var(--muted)}
.hint:hover{border-color:var(--accent);color:var(--text)}
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(1){animation-delay:-.32s}.typing span:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px}
.empty h2{font-size:1.8rem;color:var(--text);margin-bottom:12px}
.msg-actions{margin-top:8px;text-align:right}
.copy-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;margin-left:4px}
.copy-btn:hover{color:var(--text);border-color:var(--accent)}
.code-copy{position:absolute;top:6px;right:6px}
.attach-row{max-width:800px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:.78rem;color:var(--muted)}
.attach-chip img{width:22px;height:22px;border-radius:4px;object-fit:cover}
@media(max-width:768px){.sidebar{display:none}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">Jogi <span>IoT</span></div>
  <div class="tagline">Render Backend - Auto Key Rotation Active</div>
  <button class="new-chat" onclick="newChat()">+ New Search</button>
  <div class="history" id="history"></div>
  <div class="settings">
    <label>Model</label>
    <input type="text" id="model" value="nvidia/llama-3.1-nemotron-70b-instruct" onchange="saveConfig()">
    <button class="reset-btn" onclick="clearAll()" style="color:#f85149;border-color:#f8514944">Clear History</button>
  </div>
</div>
<div class="main">
  <div class="header">
    <h1>Jogi IoT Search Engine</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="copy-btn" onclick="toggleTheme()" id="themeBtn">Dark</button>
      <div class="status"><div class="dot"></div><span id="statusText">Ready (Render)</span></div>
    </div>
  </div>
  <div class="chat-container" id="chat">
    <div class="empty" id="empty">
      <h2>Ask anything - code, IoT, docs</h2>
      <p>Requests are automatically proxied through Render with key rotation (up to 50 keys).</p>
    </div>
  </div>
  <div class="input-area">
    <div class="attach-row" id="attachRow"></div>
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="Ask anything..." onkeydown="handleKey(event)"></textarea>
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach">+</button>
      <input type="file" id="fileInput" accept="image/*,.txt,.md,.csv,.json,.js,.py,.html" multiple style="display:none" onchange="handleFiles(this)">
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="hints">
      <div class="hint" onclick="setHint('Arduino DHT11 code')">Arduino DHT11</div>
      <div class="hint" onclick="setHint('MQTT vs HTTP')">MQTT vs HTTP</div>
      <div class="hint" onclick="setHint('ESP32 Wi-Fi manager setup')">ESP32 Wi-Fi</div>
      <div class="hint" onclick="setHint('Debug TypeError')">Debug error</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let messages = [], isLoading = false;

function loadConfig(){
  $('model').value = localStorage.getItem('jogiModel') || 'nvidia/llama-3.1-nemotron-70b-instruct';
  renderHistory();
}
function saveConfig(){
  localStorage.setItem('jogiModel', $('model').value);
}
function clearAll(){
  if(!confirm('Clear all chats?')) return;
  localStorage.removeItem('jogiChats');
  location.reload();
}

let conversations = [];
try{ conversations = JSON.parse(localStorage.getItem('jogiChats') || '[]'); }catch(e){}
let activeId = null;

function saveChats(){ localStorage.setItem('jogiChats', JSON.stringify(conversations.slice(-30))); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderHistory(){
  const el = $('history');
  if(!conversations.length){ el.innerHTML = '<div style="color:var(--muted);font-size:.78rem;padding:4px">No searches yet</div>'; return; }
  el.innerHTML = conversations.slice().reverse().map(c=>`<div class="history-item ${c.id===activeId?'active':''}" onclick="loadChat(${c.id})">${esc(c.title)}</div>`).join('');
}
function track(title){
  if(!activeId){
    activeId = Date.now();
    conversations.push({id:activeId, title:(title||'search').slice(0,42), messages:[]});
    if(conversations.length>30) conversations = conversations.slice(-30);
  }
  const conv = conversations.find(c=>c.id===activeId);
  if(conv) conv.messages = messages.slice(-40);
  saveChats();
  renderHistory();
}
function loadChat(id){
  const conv = conversations.find(c=>c.id===id);
  if(!conv) return;
  activeId = id;
  messages = conv.messages.slice();
  $('chat').innerHTML = '';
  messages.forEach(m => addMsg(m.role, m.content));
  renderHistory();
}

let pendingImg = null, attachedDocs = [];
function loadImg(file, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const max = 1024;
      if(w>max || h>max){ const scale = max/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb({name:file.name, dataUrl:cv.toDataURL('image/jpeg',.85)});
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function handleFiles(input){
  const files = Array.from(input.files||[]);
  input.value='';
  files.forEach(f=>{
    if(f.type.startsWith('image/')){
      loadImg(f, r=>{ pendingImg = r; renderAttach(); });
    } else {
      const r = new FileReader();
      r.onload = ()=>{ attachedDocs.push({name:f.name, text:String(r.result).slice(0,20000)}); renderAttach(); };
      r.readAsText(f);
    }
  });
}
function renderAttach(){
  const row = $('attachRow');
  row.innerHTML = '';
  if(pendingImg) row.innerHTML += `<div class="attach-chip"><img src="${pendingImg.dataUrl}"/><span>${pendingImg.name}</span><button onclick="pendingImg=null;renderAttach()">x</button></div>`;
  attachedDocs.forEach((d,i)=>{ row.innerHTML += `<div class="attach-chip"><span>${d.name}</span><button onclick="attachedDocs.splice(${i},1);renderAttach()">x</button></div>`; });
}

function toggleTheme(){
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  localStorage.setItem('jogiTheme', light ? 'light' : 'dark');
  $('themeBtn').textContent = light ? 'Light' : 'Dark';
}
function setHint(t){ $('input').value = t; $('input').focus(); }
function newChat(){ messages=[]; activeId=null; renderHistory(); $('chat').innerHTML = '<div class="empty" id="empty"><h2>Ask anything - code, IoT, docs</h2><p>Requests are automatically proxied through Render with key rotation (up to 50 keys).</p></div>'; }
function handleKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }

function addMsg(role, content){
  const empty = $('empty'); if(empty) empty.remove();
  const chat = $('chat');
  const div = document.createElement('div');
  div.className = 'message '+role;
  let html = content;
  if(role==='assistant') html = marked.parse(content);
  div.innerHTML = `<div class="avatar ${role==='user'?'user':'ai'}">${role==='user'?'You':'JI'}</div><div class="content">${html}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  div.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  if(role==='assistant') addActions(div.querySelector('.content'), content);
}

function addActions(container, raw){
  if(container.querySelector('.msg-actions')) return;
  const bar = document.createElement('div'); bar.className = 'msg-actions';
  const copy = document.createElement('button'); copy.className = 'copy-btn'; copy.textContent = 'Copy';
  copy.onclick = ()=>{ navigator.clipboard.writeText(raw); copy.textContent='Copied'; setTimeout(()=>copy.textContent='Copy',1500); };
  bar.appendChild(copy);
  container.appendChild(bar);
}

function showTyping(){
  const chat = $('chat');
  const div = document.createElement('div'); div.className = 'message assistant'; div.id = 'typing';
  div.innerHTML = '<div class="avatar ai">JI</div><div class="content"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){ const t = $('typing'); if(t) t.remove(); }

async function send(){
  const input = $('input');
  const text = input.value.trim();
  if(!text || isLoading) return;
  
  saveConfig();
  isLoading = true;
  $('sendBtn').disabled = true;
  input.value = '';

  addMsg('user', text);
  messages.push({role:'user', content:text});
  track(text);

  const image = pendingImg ? pendingImg.dataUrl : null;
  if(pendingImg){ pendingImg=null; renderAttach(); }

  showTyping();
  $('statusText').textContent = 'Thinking (Render Key Rotation)...';

  try {
    const response = await fetch('/api/nvidia/chat/completions', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    model: $('model').value.trim() || 'nvidia/llama-3.1-nemotron-70b-instruct',
    messages: [
      { role: "system", content: "You are Jogi IoT Search Engine, an expert coding and IoT assistant." },
      ...messages
    ],
    temperature: 0.3,
    max_tokens: 2048
  })
});

    const data = await response.json();
    removeTyping();

    if(!response.ok) {
      throw new Error(data.error || 'Server error occurred');
    }

    const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : JSON.stringify(data);
    
    addMsg('assistant', reply);
    messages.push({role:'assistant', content:reply});
    track();
    $('statusText').textContent = 'Ready (Render)';
  } catch(err) {
    removeTyping();
    addMsg('assistant', '**Error:** ' + err.message);
    $('statusText').textContent = 'Error';
  }

  isLoading = false;
  $('sendBtn').disabled = false;
  input.focus();
}

loadConfig();
</script>
</body>
</html>
