<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogi IoT Search Engine</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .search-box { display: flex; gap: 10px; max-width: 600px; margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #334155; }
        input { background: #1e293b; color: #fff; flex: 1; }
        button { background: #3b82f6; color: #fff; cursor: pointer; border: none; }
        button:hover { background: #2563eb; }
        pre { background: #1e293b; padding: 15px; border-radius: 6px; max-width: 600px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Jogi IoT Search Engine</h1>
    <div class="search-box">
        <input type="password" id="apiKey" placeholder="Enter JOGI_KEYS..." />
        <input type="text" id="query" placeholder="Search IoT devices..." />
        <button onclick="performSearch()">Search</button>
    </div>
    <pre id="output">Results will appear here...</pre>

    <script>
        async function performSearch() {
            const key = document.getElementById('apiKey').value;
            const query = document.getElementById('query').value;
            const output = document.getElementById('output');

            output.innerText = "Searching...";

            try {
                const response = await-fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': key
                    }
                });
                
                const data = await response.json();
                output.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                output.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
